###########################
#  Configuración global.  #
###########################

option domain-name-servers 8.8.8.8, 8.8.4.4;



#########################
#  Declaraciones host   #
#########################

host cliente1 {
  hardware ethernet aa:aa:aa:aa:aa:02;
  fixed-address 172.17.4.10;
  option routers 172.17.4.11;
  option subnet-mask 255.255.255.0;
  option domain-name-servers 8.8.8.8, 8.8.4.4;
  default-lease-time 3600;
  max-lease-time 86400;
}

host cliente2 {
  hardware ethernet aa:aa:aa:aa:aa:03;
  fixed-address 172.17.5.10;
  option routers 172.17.5.11;
  option subnet-mask 255.255.255.0;
  option domain-name-servers 8.8.8.8, 8.8.4.4;
  default-lease-time 3600;
  max-lease-time 86400;
}



#######################
#  Primera red (DMZ)  #
#######################

subnet 172.17.4.0 netmask 255.255.255.0 {
  range 172.17.4.201 172.17.4.220;
  option routers 172.17.4.11;
  max-lease-time 86400;
  default-lease-time 3600;
}



######################
#  Segunda red (MZ)  #
######################

subnet 172.17.5.0 netmask 255.255.255.0 {
  range 172.17.5.100 172.17.5.200;
  option routers 172.17.5.11;
  max-lease-time 86400;
  default-lease-time 3600;
}
